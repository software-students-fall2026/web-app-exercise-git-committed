{% macro follow_button(person, is_followed) %}
<form class="follow-form" action="{{ url_for('sonder_feed.follow', user_id=person._id) }}" method="post">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><input type="hidden" name="state" value="{{ 'off' if is_followed else 'on' }}"><input type="hidden" name="return_to" value="{{ request.full_path if request.query_string else request.path }}">
  <button class="button button-small follow-button {{ 'is-following' if is_followed }}" type="submit" aria-label="{{ 'Unfollow' if is_followed else 'Follow' }} {{ person.display_name }}" aria-pressed="{{ 'true' if is_followed else 'false' }}">{{ 'Unfollow' if is_followed else 'Follow' }}</button>
</form>
{% endmacro %}
{% macro person_card(person, is_followed, index=0, prefix='person') %}
<li class="person-card" id="{{ prefix }}-{{ person._id }}" data-person-id="{{ person._id }}">
  <div class="person-info"><h3>{{ person.display_name }}</h3><p>@{{ person.username }}</p></div>
  {{ follow_button(person, is_followed) }}
</li>
{% endmacro %}
