<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="login.css">
    <title>Sonder</title>
</head>
<body>
    <div class="login-page">
        <div class="left-side">
            <h1>"play this one with the windows down."</h1>
            <div class="card">
                <div class="user green"></div>
                <div class="info">
                    <h6>jules.wav passed along</h6>
                    <p>Ivy - Frank Ocean · Oct 12,2026</p>
                </div>
            </div>
        </div>
        <div class="right-side">
            <div class="logo">
                <div class="user green"></div>
                <h2>sonder</h2>
            </div>
            <h1>Welcome back</h1>
            <p>Pick up where your people left off</p>
            <form class="login-form" method="POST" action="/login">
                <input type="text" name="username" placeholder="Username" class="login-input" required />
                <div class="password-wrapper">
                    <input type="password" name="password" placeholder="Password" class="login-input password-input" required />
                </div>
                {% if error %}<p class="error">{{ error }}</p>{% endif %}
                <button class="buttonDesign log-button">Log In</button>
            </form>
            <p>New to Sonder? <a href="/register">Create an account</a> </p>
        </div>
    </div>
</body>
</html>
